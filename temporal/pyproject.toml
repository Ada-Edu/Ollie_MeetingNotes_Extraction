[project]
name = "boilerplate-temporal"
version = "0.0.1"
description = "Temporal worker stub for boilerplate stack"
requires-python = ">=3.11"
dependencies = [
  "temporalio==1.5.0",
  "pydantic==2.7.3",
  "pydantic-settings==2.4.0",
  "httpx==0.27.0",
  "openai==1.10.0",
  "boto3==1.34.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "pytest-json-report",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.0.0",
  "pytest-mock>=3.15.0",
  "pytest-httpx>=0.36.0",
  "freezegun>=1.5.0",
  "faker>=40.0.0",
  "fastapi==0.115.0",
  "sqlalchemy==2.0.23",
  "azure-core==1.30.0",
  "supabase==2.7.4"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
